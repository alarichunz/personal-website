<div class="home-emblem" data-aerial-screw>
  <img class="aerial-screw-fallback" src="{{ "images/aerial_screw.png" | relURL }}" alt="Leonardo da Vinci's aerial screw" width="1272" height="918">
  <canvas class="aerial-screw-canvas" width="480" height="440" role="img" aria-label="A three-dimensional interpretation of Leonardo da Vinci's aerial screw, with a spiral linen sail and wooden frame" hidden></canvas>
  <button class="aerial-screw-toggle" type="button" aria-label="Pause aerial screw rotation" hidden>
    <svg class="aerial-screw-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" hidden><path d="M7 4v16l13-8z"/></svg>
    <svg class="aerial-screw-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
  </button>
</div>
{{ with resources.Get "js/aerial-screw.js" | js.Build | resources.Minify | fingerprint }}
<script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{ end }}
