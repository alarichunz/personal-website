# =============================================================================
#  Alaric Hunziker — Hugo configuration
#  A self-contained Hugo Extended site. Layouts and SCSS live in this repo
#  (no external theme is fetched), modeled on hugo-book.
#
#  Local dev:   make run     (hugo server -D --noHTTPCache)
#  Build:       make build   (clean production output in ./public and ./dist)
# =============================================================================

baseURL    = 'https://www.alarichunz.com/'
title      = 'Alaric Hunziker'
defaultContentLanguage = 'en'
copyright  = '© 2026 Alaric Hunziker'

# Set to true once this is a git repo to get commit/edit metadata.
enableGitInfo      = false
disablePathToLower = true

# Article taxonomies are not used by the current pages.
disableKinds = ['taxonomy', 'term']

# -- Markdown / Goldmark -------------------------------------------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true                       # allow raw HTML in page content

# -- Top navigation menu -------------------------------------------------------
[menu]
  [[menu.main]]
    name = 'Notebook'
    pageRef = '/notebook'
    weight = 10
  [[menu.main]]
    name = 'Research'
    pageRef = '/research'
    weight = 20
  [[menu.main]]
    name = 'ExecuTorch Contributions'
    pageRef = '/executorch-contributions'
    weight = 30
  [[menu.main]]
    name = 'Oil Paintings'
    pageRef = '/oil-paintings'
    weight = 40
  [[menu.main]]
    name = 'Library'
    pageRef = '/library'
    weight = 50
  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 60

# -- Site params ---------------------------------------------------------------
[params]
  description = 'The lifelong workshop of an engineer with notes, research, and a reading library.'
  author      = 'Alaric Hunziker'

  # Default color theme: 'light' | 'dark' | 'auto'
  defaultTheme = 'light'

  # Icon links shown in the top nav. `icon` selects the inline SVG
  # (see layouts/partials/icon.html). Fill in your own URLs.
  [[params.social]]
    name = 'GitHub'
    icon = 'github'
    url  = 'https://github.com/alarichunz'
  [[params.social]]
    name = 'LinkedIn'
    icon = 'linkedin'
    url  = 'https://www.linkedin.com/in/alaric-hunz34712'
